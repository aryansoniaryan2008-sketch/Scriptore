<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptora – Your Documents. Beautifully Prepared.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{--navy:#101B35;--p:#7357FF;--c:#39D5E8;--bg:#F8F9FC;--t:#20283A;--m:#566079;--b:#E1E5F0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0 0 8px;letter-spacing:-.02em}
[hidden]{display:none!important}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font:700 20px Poppins,sans-serif}
header button{background:none;border:1px solid #fff5;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b)}
nav button{flex:none;border:1px solid var(--b);background:#fff;color:var(--t);border-radius:99px;padding:8px 16px;font:500 14px Inter;cursor:pointer}
nav button.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:760px;margin:0 auto;padding:18px 14px 80px}
.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 14px 30px -22px rgba(16,27,53,.4)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.ck{display:flex;gap:10px;font-weight:400;align-items:flex-start}.ck input{width:20px;flex:none;margin-top:3px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:12px;font:16px Inter,sans-serif;background:#fff;color:var(--t)}
textarea{min-height:90px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:600 15px Poppins,sans-serif;cursor:pointer;margin-top:14px}
.btn.s{background:#fff;color:var(--t);border:1px solid var(--b)}.btn:disabled{opacity:.6}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pills i{font-style:normal;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--b)}
.pills i.d{background:var(--p);color:#fff;border-color:var(--p)}.pills i.n{background:var(--navy);color:#fff}
.bar{height:10px;border-radius:9px;background:var(--b);overflow:hidden;margin:10px 0}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--c))}
.err{color:#C2255C;font-size:14px;margin-top:6px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.sm{font-size:13px;color:var(--m)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px}
</style></head>
<body>
<header><span class="logo">Scriptora</span><button id="out" hidden>Sign out</button></header>
<nav id="nav"></nav><main id="app"></main><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://rxltjkswsaytrwfpwgsy.supabase.co","sb_publishable_s_X-nhI0UyAgZj8oLzITpg_D2FnIuzX");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN");
const ST=["Order Received","Under Review","Payment Pending","Confirmed","Processing","Quality Check","Ready","Completed"],ALL=[...ST,"Cancelled","Refunded"];
const PRICE={svc:[["Handwriting-Style Lettering",5],["Document Formatting",5],["Notes Organisation",6],["Professional Document Preparation",7],["Creative Typography",10],["Diagram, short",10],["Diagram, medium",12],["Diagram, long",15]],bulk:[[250,.15],[100,.10],[50,.05]],fee:40,free:500,pins:["313301","313324","313001","313002","313003","313004"]};
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let me=null,prof=null,tab="order",mode="in",refPct=0,rt,af="",aq="";
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,3000)};
const pills=st=>{const i=ST.indexOf(st);return i<0?`<span class="err">${esc(st)}</span>`:`<div class="pills">${ST.map((s,j)=>`<i class="${j<i?"d":j===i?"n":""}">${s}</i>`).join("")}</div>`};
async function setUser(s){me=s?s.user:null;prof=null;if(me){const{data}=await sb.from("profiles").select("*").eq("id",me.id).single();prof=data}render()}
sb.auth.getSession().then(({data})=>setUser(data.session));
sb.auth.onAuthStateChange((_,s)=>setTimeout(()=>setUser(s),0));
$("#out").onclick=()=>sb.auth.signOut();
function render(){
 $("#out").hidden=!me;
 const T=[["order","Order"],["mine","My orders"],["track","Track"],["creator","Creator"]];if(prof&&prof.is_admin)T.push(["admin","Admin"]);
 $("#nav").innerHTML=T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
 ({order:vOrder,mine:vMine,track:vTrack,creator:vCreator,admin:vAdmin})[tab]();
}
function go(t){tab=t;render()}
function vAuth(){$("#app").innerHTML=`<div class="card"><h2>${mode==="in"?"Log in":"Create your account"}</h2><form onsubmit="auth(event)">${mode==="up"?`<label>Full name</label><input id="fn" required autocomplete="name"><label>Phone number</label><input id="ph" type="tel" required placeholder="10-digit mobile number">`:""}<label>Email</label><input id="em" type="email" required autocomplete="email"><label>Password (8+ characters)</label><input id="pw" type="password" minlength="8" required><div class="err" id="ae"></div><button class="btn">${mode==="in"?"Log in":"Sign up"}</button></form><p><a href="#" onclick="mode='${mode==="in"?"up":"in"}';vAuth();return false">${mode==="in"?"New here? Create an account":"Have an account? Log in"}</a></p></div>`}
async function auth(e){e.preventDefault();const em=$("#em").value.trim(),pw=$("#pw").value,A=$("#ae");let r;
 if(mode==="up"){const ph=$("#ph").value.replace(/[\s-]/g,"");if(!/^(\+91)?[6-9]\d{9}$/.test(ph)){A.textContent="Enter a valid 10-digit Indian mobile number.";return}
  r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$("#fn").value.trim(),phone:ph}}});
  if(!r.error&&!r.data.session){A.textContent="Check your email to confirm your account, then log in.";return}}
 else r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error)A.textContent=r.error.message}
function calc(){const s=PRICE.svc[+$("#sv").value],pg=Math.max(0,+$("#pg").value||0),sub=s[1]*pg,bp=(PRICE.bulk.find(x=>pg>=x[0])||[0,0])[1],bd=sub*bp,rd=(sub-bd)*refPct/100,net=sub-bd-rd,dv=$("#fu").value==="delivery"&&net>0&&net<PRICE.free?PRICE.fee:0;return{sub,bd,rd,dv,total:net+dv}}
function upd(){const c=calc();$("#ad").hidden=$("#fu").value!=="delivery";$("#pl").textContent=+$("#sv").value>=5?"Number of diagrams":"Number of pages";
 $("#est").innerHTML=`<div class="row"><span>Subtotal</span><b>${inr(c.sub)}</b></div>${c.bd?`<div class="row"><span>Bulk discount</span><b>−${inr(c.bd)}</b></div>`:""}${c.rd?`<div class="row"><span>Referral discount</span><b>−${inr(c.rd)}</b></div>`:""}<div class="row"><span>Delivery</span><b>${inr(c.dv)}</b></div><div class="row"><b>Estimated total</b><b>${inr(c.total)}</b></div><div class="sm">Free delivery above ${inr(PRICE.free)}. The final price is confirmed after review.</div>`}
function chkRef(){clearTimeout(rt);rt=setTimeout(async()=>{const c=$("#rc").value.trim();if(c.length<3){refPct=0;$("#rm").textContent="";upd();return}const{data}=await sb.rpc("referral_discount",{p_code:c});refPct=Number(data)||0;$("#rm").textContent=refPct?refPct+"% off applied":"Code not found";upd()},400)}
function vOrder(){if(!me)return vAuth();refPct=0;
 $("#app").innerHTML=`<form class="card" onsubmit="submitOrder(event)"><h2>Place an order</h2>
<label>Service</label><select id="sv" onchange="upd()">${PRICE.svc.map((s,i)=>`<option value="${i}">${s[0]} (${inr(s[1])} each)</option>`).join("")}</select>
<label id="pl">Number of pages</label><input id="pg" type="number" min="1" max="5000" value="1" oninput="upd()">
<label>Document requirements</label><textarea id="rq"></textarea>
<label>Deadline</label><input id="dl" type="date" min="${today}">
<label>Pickup or delivery</label><select id="fu" onchange="upd()"><option value="pickup">Pickup (free)</option><option value="delivery">Home delivery</option></select>
<div id="ad" hidden><label>Delivery address</label><textarea id="adr"></textarea><label>Pincode</label><input id="pin" inputmode="numeric" maxlength="6"></div>
<label>Preferred time slot</label><select id="sl"><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
<label>Referral code (optional) <span id="rm" class="sm"></span></label><input id="rc" oninput="chkRef()" autocapitalize="characters">
<label>Phone number</label><input id="ph" type="tel" value="${esc(prof&&prof.phone||"")}">
<label>Upload documents (PDF, DOCX or images, max 10 MB each)</label><input id="fl" type="file" multiple accept=".pdf,.docx,.jpg,.jpeg,.png,.webp">
<label class="ck"><input id="wa" type="checkbox"><span>Send my order updates on WhatsApp.</span></label>
<label class="ck"><input id="cn" type="checkbox"><span>I confirm I have permission to use the material I submit and I am using Scriptora for legitimate document preparation.</span></label>
<div class="card" id="est" style="margin-top:14px"></div><div class="err" id="oe"></div><button class="btn">Submit order</button></form>`;upd()}
async function submitOrder(e){e.preventDefault();const E=m=>$("#oe").textContent=m;
 const pg=+$("#pg").value,ph=$("#ph").value.replace(/[\s-]/g,""),del=$("#fu").value==="delivery";
 if(!(pg>=1&&pg<=5000))return E("Enter 1 to 5,000 pages.");
 if(!/^(\+91)?[6-9]\d{9}$/.test(ph))return E("Enter a valid 10-digit mobile number.");
 if($("#rq").value.trim().length<10)return E("Describe your requirements (10+ characters).");
 if(!$("#dl").value||$("#dl").value<today)return E("Choose a deadline from today onwards.");
 if(del&&($("#adr").value.trim().length<10||!PRICE.pins.includes($("#pin").value.trim())))return E("Enter your full address and a pincode we deliver to: 313301, 313324 or 313001 to 313004.");
 if(!$("#cn").checked)return E("Please tick the permission checkbox.");
 const files=[...$("#fl").files];for(const f of files)if(!/\.(pdf|docx|jpe?g|png|webp)$/i.test(f.name)||f.size>10485760)return E(`“${f.name}” must be a PDF, DOCX or image under 10 MB.`);
 E("");const b=e.target.querySelector(".btn");b.disabled=true;b.textContent="Submitting…";const done=()=>{b.disabled=false;b.textContent="Submit order"};
 const paths=[];for(const f of files){const p=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,"_")}`,u=await sb.storage.from("order-files").upload(p,f);if(u.error){done();return E("Upload failed: "+u.error.message)}paths.push(p)}
 const c=calc(),s=PRICE.svc[+$("#sv").value];
 const{data,error}=await sb.from("orders").insert({user_id:me.id,email:me.email,phone:ph,service:s[0],pages:pg,requirements:$("#rq").value.trim()+(paths.length?"\n\nFILES:"+paths.join("|"):""),deadline:$("#dl").value,fulfilment:del?"delivery":"pickup",address:del?$("#adr").value.trim():null,pincode:del?$("#pin").value.trim():null,slot:$("#sl").value,subtotal:c.sub,discount:c.bd+c.rd,delivery_fee:c.dv,total:c.total,referral_code:$("#rc").value.trim()||null,consent:true,whatsapp_opt_in:$("#wa").checked}).select("order_no").single();
 done();if(error)return E(error.message);
 $("#app").innerHTML=`<div class="card"><h2>Order received</h2><p>Your order ID is <b>${esc(data.order_no)}</b>. We will review it and update the status here.</p><button class="btn" onclick="go('mine')">View my orders</button></div>`}
async function vMine(){if(!me)return vAuth();$("#app").innerHTML="<p>Loading…</p>";
 const{data:o,error}=await sb.from("orders").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(50);
 if(error){$("#app").innerHTML=`<div class="card err">${esc(error.message)}</div>`;return}
 const{data:cb}=await sb.from("credit_balance").select("balance").eq("user_id",me.id).maybeSingle();
 $("#app").innerHTML=`<div class="card">Credit balance: <b>${inr(cb&&cb.balance||0)}</b></div>`+(o.length?o.map(x=>`<div class="card"><div class="row"><b>${esc(x.order_no)}</b><span>${inr(x.total)}</span></div><div class="sm">${esc(x.service)}, ${x.pages} pages, ${x.fulfilment}</div>${pills(x.status)}</div>`).join(""):`<div class="card">No orders yet. <a href="#" onclick="go('order');return false">Place your first order</a>.</div>`)}
function vTrack(){$("#app").innerHTML=`<form class="card" onsubmit="track(event)"><h2>Track your order</h2><label>Order ID</label><input id="to" placeholder="SCR-2026-0001" autocapitalize="characters" required><label>Phone or email used for the order</label><input id="tc" required><button class="btn">Track</button></form><div id="tr"></div>`}
async function track(e){e.preventDefault();const{data,error}=await sb.rpc("track_order",{p_order_no:$("#to").value,p_contact:$("#tc").value});
 $("#tr").innerHTML=error?`<div class="card err">${esc(error.message)}</div>`:!data.length?`<div class="card">No order found. Check the ID and the phone or email.</div>`:data.map(x=>`<div class="card"><h3>${esc(x.order_no)}</h3>${pills(x.status)}<p class="sm">${esc(x.fulfilment)}</p>${(x.history||[]).map(h=>`<div class="sm">${esc(h.status)}: ${new Date(h.at).toLocaleString("en-IN")}</div>`).join("")}</div>`).join("")}
async function vCreator(){if(!me)return vAuth();
 const{data:c}=await sb.from("creators").select("*").eq("user_id",me.id).maybeSingle();
 if(!c){$("#app").innerHTML=`<form class="card" onsubmit="mkCode(event)"><h2>Become a creator</h2><p>Create your own code. Customers who use it get 10% off. For every 500 pages your referrals complete, you earn ₹250 to withdraw and ₹250 in site credits.</p><label>Channel or handle name</label><input id="hd" required><label>UPI ID (for withdrawals)</label><input id="up" placeholder="name@bank"><div class="err" id="ce"></div><button class="btn">Create my code</button></form>`;return}
 const{data:s}=await sb.from("creator_summary").select("*").eq("user_id",me.id).maybeSingle(),{data:pr}=await sb.from("payout_requests").select("*").eq("creator_id",me.id).order("requested_at",{ascending:false});
 const q=s?s.qualified_pages:0,w=Number(s?s.withdrawable:0);
 $("#app").innerHTML=`<div class="card"><h2>Your code: ${esc(c.code)}</h2><p>Share it. Customers get 10% off when they enter it.</p><div class="bar"><b style="width:${(q%500)/5}%"></b></div><p>${q%500} of 500 pages. ${500-q%500} more for the next ₹250 cash and ₹250 credits.</p><div class="row"><span>Withdrawable</span><b>${inr(w)}</b></div><label>UPI ID</label><input id="up" value="${esc(c.upi_id||"")}"><button class="btn s" onclick="saveUpi()">Save UPI</button> <button class="btn" onclick="payout()">Withdraw</button><div class="err" id="ce"></div></div><div class="card"><h3>Withdrawals</h3>${pr&&pr.length?pr.map(p=>`<div class="row"><span>${inr(p.amount)}</span><span>${esc(p.status)}</span></div>`).join(""):"None yet."}</div>`}
async function mkCode(e){e.preventDefault();const{error}=await sb.rpc("become_creator",{p_handle:$("#hd").value,p_upi:$("#up").value.trim()||null});if(error)$("#ce").textContent=error.message;else vCreator()}
async function saveUpi(){const{error}=await sb.from("creators").update({upi_id:$("#up").value.trim()}).eq("user_id",me.id);error?$("#ce").textContent=error.message:toast("UPI saved")}
async function payout(){const{error}=await sb.rpc("request_payout");error?$("#ce").textContent=error.message:(toast("Withdrawal requested"),vCreator())}
async function vAdmin(){$("#app").innerHTML="<p>Loading…</p>";
 let q=sb.from("orders").select("*").order("created_at",{ascending:false}).limit(60);if(af)q=q.eq("status",af);
 const[{data:o,error},{data:p}]=await Promise.all([q,sb.from("payout_requests").select("*").eq("status","requested")]);
 if(error){$("#app").innerHTML=`<div class="card err">${esc(error.message)}</div>`;return}
 const L=o.filter(x=>!aq||(x.order_no+x.phone).toLowerCase().includes(aq.toLowerCase())),rev=o.filter(x=>x.paid).reduce((a,x)=>a+Number(x.total),0);
 $("#app").innerHTML=`<div class="card"><h2>Admin</h2><div class="row"><span>Orders loaded</span><b>${o.length}</b></div><div class="row"><span>Completed</span><b>${o.filter(x=>x.status==="Completed").length}</b></div><div class="row"><span>Paid revenue</span><b>${inr(rev)}</b></div><label>Filter by status</label><select onchange="af=this.value;vAdmin()"><option value="">All</option>${ALL.map(s=>`<option ${s===af?"selected":""}>${s}</option>`).join("")}</select><label>Search order ID or phone</label><input value="${esc(aq)}" onchange="aq=this.value;vAdmin()"></div>
${p&&p.length?`<div class="card"><h3>Withdrawal requests</h3>${p.map(x=>`<div class="row"><span>${inr(x.amount)} to ${esc(x.upi_id)}</span><button class="btn s" onclick="payDone(${x.id})">Mark paid</button></div>`).join("")}</div>`:""}
${L.map(x=>{const raw=x.requirements||"",fs=(raw.split("\n\nFILES:")[1]||"").split("|").filter(Boolean);return `<div class="card"><div class="row"><b>${esc(x.order_no)}</b><span>${inr(x.total)} ${x.paid?"(paid)":"(unpaid)"}</span></div><p class="sm">${esc(x.service)}, ${x.pages} pages, ${x.fulfilment}${x.fulfilment==="delivery"?" to "+esc(x.address)+" "+esc(x.pincode):""}<br>${esc(x.phone)} / ${esc(x.email)}<br>Deadline ${esc(x.deadline||"")}, ${esc(x.slot||"")}</p><p>${esc(raw.split("\n\nFILES:")[0])}</p>${fs.map((f,i)=>`<button class="btn s" onclick="openFile('${esc(f)}')">File ${i+1}</button> `).join("")}<label>Status</label><select onchange="setStatus('${x.id}',this.value)">${ALL.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select>${x.paid?"":`<button class="btn s" onclick="markPaid('${x.id}')">Mark paid</button>`}</div>`}).join("")}`}
async function setStatus(id,v){const{error}=await sb.from("orders").update({status:v}).eq("id",id);toast(error?error.message:"Status updated")}
async function markPaid(id){const{error}=await sb.from("orders").update({paid:true}).eq("id",id);error?toast(error.message):vAdmin()}
async function payDone(id){const{error}=await sb.from("payout_requests").update({status:"paid",paid_at:new Date().toISOString()}).eq("id",id);error?toast(error.message):vAdmin()}
async function openFile(p){const{data,error}=await sb.storage.from("order-files").createSignedUrl(p,300);error?toast(error.message):window.open(data.signedUrl,"_blank")}
</script></body></html>
